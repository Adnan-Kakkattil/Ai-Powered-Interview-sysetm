services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_system_web
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - MAX_CONTENT_LENGTH=10485760
      - DATABASE_PATH=/data/interview_system.db
    restart: always
    volumes:
      - ./uploads:/app/uploads
      - db_data:/data

volumes:
  db_data:
